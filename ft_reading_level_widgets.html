<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reading level widgets</title>
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; }

  .ft-wrap {
    font-family: 'Georgia', var(--font-serif);
    background: #FDF6EC;
    border: 1px solid #2a2216;
    border-radius: 4px;
    padding: 20px 16px;
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .ft-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #2a2216;
    font-family: 'Arial', sans-serif;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .widget-section {
    border-bottom: 0.5px solid #c5b89a;
    padding-bottom: 18px;
  }
  .widget-section:last-child { border-bottom: none; padding-bottom: 0; }

  /* Widget 1 — Ink dial */
  .ink-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .ink-dial {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid #2a2216;
    cursor: pointer;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    background: #FDF6EC;
    transition: transform 0.1s;
    flex-shrink: 0;
  }
  .ink-dial.active .ink-fill {
    background: #2a2216;
  }
  .ink-fill {
    border-radius: 50%;
    background: #FDF6EC;
    transition: width 0.2s, height 0.2s;
  }
  .ink-desc {
    font-family: 'Arial', sans-serif;
    font-size: 11px;
    color: #5a4a32;
    line-height: 1.4;
  }

  /* Widget 2 — Pilcrow thermometer */
  .thermo-wrap {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .thermo-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .thermo-bar-bg {
    width: 10px;
    height: 60px;
    border: 1px solid #2a2216;
    border-radius: 5px;
    position: relative;
    overflow: hidden;
    background: #FDF6EC;
  }
  .thermo-bar-fill {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: #2a2216;
    transition: height 0.3s;
  }
  .thermo-label {
    font-family: 'Arial', sans-serif;
    font-size: 10px;
    color: #5a4a32;
  }
  .pilcrow {
    font-size: 22px;
    color: #2a2216;
    font-family: 'Georgia', serif;
    line-height: 1;
    margin-top: 4px;
  }
  .thermo-desc {
    font-family: 'Arial', sans-serif;
    font-size: 11px;
    color: #5a4a32;
    line-height: 1.4;
    margin-top: 4px;
  }

  /* Widget 4 — Concentric rings */
  .rings-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .rings-svg { cursor: pointer; flex-shrink: 0; }
  .rings-desc {
    font-family: 'Arial', sans-serif;
    font-size: 11px;
    color: #5a4a32;
    line-height: 1.4;
  }

  /* Widget 5 — Type weight sampler */
  .type-row {
    display: flex;
    gap: 6px;
    align-items: baseline;
    cursor: pointer;
  }
  .type-glyph {
    font-family: 'Georgia', serif;
    color: #2a2216;
    border-bottom: 1.5px solid transparent;
    padding-bottom: 1px;
    transition: color 0.2s;
    line-height: 1;
  }
  .type-glyph.active {
    border-bottom-color: #8B1A2F;
    color: #8B1A2F;
  }
  .type-desc {
    font-family: 'Arial', sans-serif;
    font-size: 11px;
    color: #5a4a32;
    margin-top: 6px;
    line-height: 1.4;
  }

  .page-wrap {
    display: flex;
    gap: 32px;
    padding: 24px 0;
    justify-content: center;
    flex-wrap: wrap;
  }
  .section-title {
    font-family: 'Arial', sans-serif;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #8a7a62;
    margin-bottom: 6px;
    font-weight: 700;
  }
</style>
</head>
<body>

<div class="page-wrap">

  <!-- WIDGET 1 — Ink dial -->
  <div>
    <div class="section-title">1 · Ink dial</div>
    <div class="ft-wrap" style="width:192px;">
      <div class="widget-section">
        <div class="ft-label">Reading level</div>
        <div id="ink-dials" class="ink-row" style="flex-wrap:wrap; gap:6px;"></div>
        <div class="ink-desc" id="ink-desc" style="margin-top:10px;"></div>
      </div>
    </div>
  </div>

  <!-- WIDGET 2 — Pilcrow thermometer -->
  <div>
    <div class="section-title">2 · ¶ Thermometer</div>
    <div class="ft-wrap" style="width:192px;">
      <div class="widget-section">
        <div class="ft-label">Reading level</div>
        <div class="thermo-wrap">
          <div id="thermo-bars" style="display:flex; gap:5px; align-items:flex-end;"></div>
          <div>
            <div class="pilcrow">¶</div>
            <div class="thermo-desc" id="thermo-desc" style="margin-top:8px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- WIDGET 4 — Concentric rings -->
  <div>
    <div class="section-title">4 · Reach rings</div>
    <div class="ft-wrap" style="width:192px;">
      <div class="widget-section">
        <div class="ft-label">Reading level</div>
        <div class="rings-wrap">
          <svg id="rings-svg" class="rings-svg" width="72" height="72" viewBox="0 0 72 72" onclick="cycleRings()"></svg>
          <div class="rings-desc" id="rings-desc"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- WIDGET 5 — Type weight sampler -->
  <div>
    <div class="section-title">5 · Type sampler</div>
    <div class="ft-wrap" style="width:192px;">
      <div class="widget-section">
        <div class="ft-label">Reading level</div>
        <div id="type-row" class="type-row"></div>
        <div class="type-desc" id="type-desc"></div>
      </div>
    </div>
  </div>

</div>

<script>
  const levels = ['Original','Clearer','Simpler','Plainer','Essential'];
  const levelDescs = [
    'Full editorial prose',
    'Shorter sentences',
    'Everyday vocabulary',
    'Plain language',
    'Core facts only'
  ];

  // ---- Widget 1: Ink dials ----
  let inkLevel = 1;
  const inkSizes = [8,14,20,28,34];
  function buildInkDials() {
    const wrap = document.getElementById('ink-dials');
    wrap.innerHTML = '';
    levels.forEach((l,i) => {
      const d = document.createElement('div');
      d.className = 'ink-dial' + (i===inkLevel?' active':'');
      d.title = l;
      d.style.border = '1.5px solid #2a2216';
      const fill = document.createElement('div');
      fill.className = 'ink-fill';
      const sz = inkSizes[i];
      fill.style.width = sz+'px';
      fill.style.height = sz+'px';
      if(i===inkLevel) fill.style.background = '#2a2216';
      d.appendChild(fill);
      d.onclick = () => { inkLevel=i; buildInkDials(); };
      wrap.appendChild(d);
    });
    document.getElementById('ink-desc').textContent = levels[inkLevel]+' — '+levelDescs[inkLevel];
  }
  buildInkDials();

  // ---- Widget 2: Pilcrow thermometer ----
  let thermoLevel = 1;
  const thermoHeights = [60,48,36,24,12];
  function buildThermo() {
    const wrap = document.getElementById('thermo-bars');
    wrap.innerHTML = '';
    levels.forEach((l,i) => {
      const col = document.createElement('div');
      col.className = 'thermo-col';
      col.title = l;
      const bg = document.createElement('div');
      bg.className = 'thermo-bar-bg';
      const fill = document.createElement('div');
      fill.className = 'thermo-bar-fill';
      fill.style.height = thermoHeights[i]+'px';
      fill.style.background = i===thermoLevel ? '#8B1A2F' : '#2a2216';
      fill.style.opacity = i===thermoLevel ? '1' : '0.35';
      bg.appendChild(fill);
      const lbl = document.createElement('div');
      lbl.className = 'thermo-label';
      lbl.textContent = i+1;
      col.appendChild(bg);
      col.appendChild(lbl);
      col.onclick = () => { thermoLevel=i; buildThermo(); };
      wrap.appendChild(col);
    });
    document.getElementById('thermo-desc').textContent = levels[thermoLevel]+'\n'+levelDescs[thermoLevel];
  }
  buildThermo();

  // ---- Widget 4: Concentric rings ----
  let ringsLevel = 1;
  function ringBandPath(cx, cy, rOuter, rInner) {
    const outer = `M ${cx + rOuter} ${cy} A ${rOuter} ${rOuter} 0 1 1 ${cx - rOuter} ${cy} A ${rOuter} ${rOuter} 0 1 1 ${cx + rOuter} ${cy}`;
    if (rInner <= 0) return outer + ' Z';
    const inner = `M ${cx + rInner} ${cy} A ${rInner} ${rInner} 0 1 0 ${cx - rInner} ${cy} A ${rInner} ${rInner} 0 1 0 ${cx + rInner} ${cy}`;
    return outer + ' ' + inner + ' Z';
  }

  function drawRings() {
    const svg = document.getElementById('rings-svg');
    svg.innerHTML = '';
    const cx = 36, cy = 36;
    // Index 0 = outermost (Original) … 4 = innermost (Essential)
    const radii = [34, 27, 20, 13, 6];

    for (let i = 0; i < radii.length; i++) {
      if (i === ringsLevel) continue;
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', cx);
      c.setAttribute('cy', cy);
      c.setAttribute('r', radii[i]);
      c.setAttribute('fill', 'none');
      c.setAttribute('stroke', '#2a2216');
      c.setAttribute('stroke-width', '1');
      svg.appendChild(c);
    }

    const rOuter = radii[ringsLevel];
    const rInner = ringsLevel < radii.length - 1 ? radii[ringsLevel + 1] : 0;
    const active = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    active.setAttribute('d', ringBandPath(cx, cy, rOuter, rInner));
    active.setAttribute('fill', '#8B1A2F');
    active.setAttribute('fill-rule', 'evenodd');
    active.setAttribute('stroke', '#2a2216');
    active.setAttribute('stroke-width', '1');
    svg.appendChild(active);

    document.getElementById('rings-desc').textContent = levels[ringsLevel]+' — '+levelDescs[ringsLevel];
  }
  function cycleRings() { ringsLevel=(ringsLevel+1)%5; drawRings(); }
  drawRings();

  // ---- Widget 5: Type sampler ----
  let typeLevel = 1;
  const typeSizes = [28,23,18,14,11];
  const typeWeights = [700,600,500,400,300];
  function buildType() {
    const wrap = document.getElementById('type-row');
    wrap.innerHTML = '';
    levels.forEach((l,i) => {
      const g = document.createElement('span');
      g.className = 'type-glyph' + (i===typeLevel?' active':'');
      g.style.fontSize = typeSizes[i]+'px';
      g.style.fontWeight = typeWeights[i];
      g.style.opacity = i===typeLevel ? '1' : '0.4';
      g.textContent = 'A';
      g.title = l;
      g.onclick = () => { typeLevel=i; buildType(); };
      wrap.appendChild(g);
    });
    document.getElementById('type-desc').textContent = levels[typeLevel]+' — '+levelDescs[typeLevel];
  }
  buildType();
</script>

</body>
</html>
